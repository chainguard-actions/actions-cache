name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/test-cache-dir
          echo "hello cache" > /tmp/test-cache-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-dir
          key: test-cache-basic-${{ github.run_id }}

      - name: Assert cache-hit is false or action failed gracefully
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # On a fresh unique key, cache-hit should be false (cache miss)
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a unique key, got true"
              exit 1
            fi
            echo "PASS: cache-hit is '$CACHE_HIT' (expected false for new key)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache API not available for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
