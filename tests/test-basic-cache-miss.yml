name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test-dir
          echo "hello cache" > /tmp/cache-test-dir/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-test-dir
          key: test-cache-miss-${{ github.run_id }}-${{ github.run_attempt }}
        continue-on-error: true

      - name: Assert cache-hit is false or empty (new unique key, no cache)
        env:
          ACTUAL: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "actual cache-hit: $ACTUAL"
          # The action either:
          # 1. Succeeded with cache-hit=false (cache service unavailable, handled gracefully)
          # 2. Succeeded with cache-hit=false (cache miss)
          # 3. Failed (cache service error) - outcome=failure, cache-hit=empty
          # In all cases, cache-hit must NOT be "true"
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty for a new unique key"
            exit 1
          fi
          echo "PASS: cache-hit is not true (cache miss or service unavailable as expected)"
