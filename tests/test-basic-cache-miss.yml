name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache-test"
          echo "hello cache" > "$GITHUB_WORKSPACE/.cache-test/data.txt"

      - id: cache
        uses: .
        with:
          path: .cache-test
          key: test-cache-key-${{ github.run_id }}-basic
        continue-on-error: true

      - name: Assert cache-hit is false or action failed gracefully
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # On a fresh key, cache-hit should be false (no prior cache)
            # When cache service is unavailable, action exits early with cache-hit=false
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a brand new key"
              exit 1
            fi
            echo "PASS: cache miss as expected (cache-hit=$CACHE_HIT)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not reachable under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
