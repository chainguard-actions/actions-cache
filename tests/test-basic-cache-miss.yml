name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test
          echo "hello cache" > /tmp/cache-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-test
          key: test-cache-miss-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit is false on first run
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # When the cache service is unavailable (act environment), the action sets
          # cache-hit to 'false' and exits successfully.
          # When the cache service is available but no cache exists, cache-hit is also
          # false/empty (intentional behavior per actions/cache#1466).
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty on first run"
            exit 1
          fi
          echo "PASS: cache-hit is not true (cache miss as expected, value='$CACHE_HIT')"
