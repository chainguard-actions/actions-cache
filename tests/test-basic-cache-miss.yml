name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Node.js 24 is available
        run: |
          if ! node --version 2>/dev/null | grep -q "^v24"; then
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y nodejs
          fi
          node --version
      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test
          echo "hello cache" > /tmp/cache-test/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-test
          key: test-cache-key-${{ runner.os }}-basic
        continue-on-error: true
      - name: Assert cache-hit is false on miss
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          STEP_OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "cache-hit: '$CACHE_HIT'"
          echo "step outcome: '$STEP_OUTCOME'"
          # Under act, cache service is unavailable.
          # The action may error (outcome=failure) or return cache-hit=false/empty.
          # Either way, cache-hit must NOT be "true".
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty on first run"
            exit 1
          fi
          echo "PASS: cache-hit is not true (expected miss under act)"
