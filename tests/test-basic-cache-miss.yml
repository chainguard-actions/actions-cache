name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Disable cache service so the action exits early without network calls.
      # @actions/cache v6 checks these env vars to determine if cache is available.
      ACTIONS_CACHE_URL: ""
      ACTIONS_RESULTS_URL: ""
      ACTIONS_CACHE_SERVICE_V2: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/test-cache-dir
          echo "hello cache" > /tmp/test-cache-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-dir
          key: test-cache-miss-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit is false or action failed gracefully
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # Cache service unavailable: action exits early with cache-hit=false
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit to be false for a unique key, got true"
              exit 1
            fi
            echo "PASS: cache-hit is '$CACHE_HIT' (not true) as expected for a cache miss"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in this environment)"
          else
            echo "PASS: outcome was '$OUTCOME'"
          fi
