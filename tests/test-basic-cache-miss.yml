name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate unique cache key
        id: gen-key
        run: echo "key=test-cache-miss-$(date +%s%N)-$$" >> "$GITHUB_OUTPUT"
      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test
          echo "hello cache" > /tmp/cache-test/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-test
          key: ${{ steps.gen-key.outputs.key }}
        continue-on-error: true
      - name: Assert cache-hit is not true (new unique key = cache miss)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "outcome: $OUTCOME"
          # With a unique key, cache-hit must NOT be "true".
          # In act without cache service: action exits early with cache-hit=false (success).
          # In act with local cache service: cache miss, cache-hit not set (step may succeed or fail).
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false for a unique key"
            exit 1
          fi
          echo "PASS: cache-hit is not true as expected for a new unique key"
