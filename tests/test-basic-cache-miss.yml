name: Test basic cache miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test-dir
          echo "hello cache" > /tmp/cache-test-dir/hello.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-test-dir
          key: test-cache-miss-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit is false or action ran gracefully
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # On a cache miss, cache-hit should be false or empty
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false on first run, got true"
              exit 1
            fi
            echo "PASS: cache miss confirmed (cache-hit=$CACHE_HIT)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
