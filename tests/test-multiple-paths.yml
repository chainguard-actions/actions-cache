name: Test multiple paths caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple files to cache
        run: |
          mkdir -p /tmp/cache-multi-a
          mkdir -p /tmp/cache-multi-b
          echo "file a" > /tmp/cache-multi-a/a.txt
          echo "file b" > /tmp/cache-multi-b/b.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: |
            /tmp/cache-multi-a
            /tmp/cache-multi-b
          key: test-multi-paths-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit is not true (no prior cache)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # Under act, cache service may not be available; action may exit early or fail gracefully.
          # Either way, cache-hit must NOT be "true" since no prior cache exists.
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty (no prior cache)"
            exit 1
          fi
          echo "PASS: cache-hit is not true as expected (value: '$CACHE_HIT', outcome: '$OUTCOME')"

      - name: Assert both files still exist
        run: |
          if [ ! -f /tmp/cache-multi-a/a.txt ]; then
            echo "FAIL: file a should still exist"
            exit 1
          fi
          if [ ! -f /tmp/cache-multi-b/b.txt ]; then
            echo "FAIL: file b should still exist"
            exit 1
          fi
          echo "PASS: both files exist"
