name: Test multiple paths caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create multiple files/directories to cache
        run: |
          mkdir -p /tmp/multi-cache-a
          mkdir -p /tmp/multi-cache-b
          echo "data a" > /tmp/multi-cache-a/file-a.txt
          echo "data b" > /tmp/multi-cache-b/file-b.txt

      - id: cache
        uses: .
        with:
          path: |
            /tmp/multi-cache-a
            /tmp/multi-cache-b
          key: test-multi-path-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit output is valid for multiple paths
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value for multiple paths: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: multiple paths cache completed with cache-hit='$CACHE_HIT'"
