name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory to reference
        run: |
          mkdir -p /tmp/cache-lookup
          echo "lookup test" > /tmp/cache-lookup/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-lookup
          key: test-lookup-only-key-${{ runner.os }}-99999
          lookup-only: 'true'
        continue-on-error: true
      - name: Assert lookup-only completed
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # In act environment, cache service is not available so the step may
          # succeed or fail gracefully; it should not be a hard crash
          if [ "$OUTCOME" = "failure" ]; then
            echo "INFO: step failed (expected in act without cache service)"
          else
            echo "PASS: lookup-only completed with outcome: $OUTCOME"
          fi
          # The key assertion: cache-hit should not be 'true' since no cache was saved
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: cache-hit should not be true for a key that was never saved"
            exit 1
          fi
          echo "PASS: cache-hit is not true"
