name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory to cache
        run: |
          mkdir -p /tmp/cache-lookup
          echo "lookup test data" > /tmp/cache-lookup/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-lookup
          key: test-lookup-only-unique-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: 'true'
        continue-on-error: true
      - name: Assert lookup-only ran without error and cache-hit is false for new key
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # For a brand new key, cache-hit should be false or empty
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false for a unique key in lookup-only mode"
            exit 1
          fi
          echo "PASS: lookup-only mode ran correctly, cache-hit is not true for new key"
