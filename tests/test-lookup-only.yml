name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to reference
        run: |
          mkdir -p /tmp/lookup-test-dir
          echo "lookup test" > /tmp/lookup-test-dir/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/lookup-test-dir
          key: test-lookup-only-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: 'true'

      - name: Assert lookup-only ran and cache-hit is false (no prior cache)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With lookup-only and a unique key, cache-hit should be false
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a unique key in lookup-only mode"
              exit 1
            fi
            echo "PASS: lookup-only mode ran successfully, cache-hit=$CACHE_HIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
