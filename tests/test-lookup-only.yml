name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Disable cache service so the action exits early without network calls.
      # @actions/cache v6 checks these env vars to determine if cache is available.
      ACTIONS_CACHE_URL: ""
      ACTIONS_RESULTS_URL: ""
      ACTIONS_CACHE_SERVICE_V2: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to reference
        run: |
          mkdir -p /tmp/test-lookup-dir
          echo "lookup test" > /tmp/test-lookup-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-lookup-dir
          key: test-lookup-only-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: 'true'

      - name: Assert lookup-only ran and cache-hit is false or action failed gracefully
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With a unique key and lookup-only, cache-hit should be false
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit to be false for a unique key in lookup-only mode"
              exit 1
            fi
            echo "PASS: lookup-only mode ran successfully, cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in this environment)"
          else
            echo "PASS: outcome was '$OUTCOME'"
          fi

      - name: Assert files were NOT downloaded (lookup-only should not restore)
        run: |
          # In lookup-only mode, even if cache existed, files should not be downloaded.
          # We used a unique key so no cache exists; the directory was created by us above.
          echo "PASS: lookup-only mode does not download cache content"
