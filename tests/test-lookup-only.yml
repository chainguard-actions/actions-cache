name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare target directory (empty)
        run: |
          mkdir -p /tmp/lookup-only-target

      - id: cache
        uses: .
        with:
          path: /tmp/lookup-only-target
          key: test-lookup-only-unique-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: 'true'
        continue-on-error: true

      - name: Assert cache-hit is false or empty in lookup-only mode for new key
        env:
          ACTUAL: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "actual cache-hit: $ACTUAL"
          # In lookup-only mode with a new unique key, cache-hit must not be "true"
          # The action either succeeds with cache-hit=false, or fails gracefully
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty for a new unique key in lookup-only mode"
            exit 1
          fi
          echo "PASS: cache-hit is not true (no cache found, lookup-only mode works)"

      - name: Assert no files were downloaded (lookup-only should not restore)
        run: |
          # In lookup-only mode, even if there were a cache hit, files should not be downloaded.
          # Since this is a new key, the directory should remain empty.
          COUNT=$(find /tmp/lookup-only-target -type f | wc -l)
          echo "files in target: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: expected no files to be restored in lookup-only mode"
            exit 1
          fi
          echo "PASS: no files restored in lookup-only mode"
