name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-lookup-test
          echo "lookup only test" > /tmp/cache-lookup-test/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-lookup-test
          key: test-lookup-only-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: 'true'

      - name: Assert cache-hit is not true (no prior cache, lookup-only mode)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # In lookup-only mode with no existing cache, cache-hit should be false or empty.
          # Under act, cache service may not be available; action may exit early.
          # Either way, cache-hit must NOT be "true".
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false or empty in lookup-only mode with no prior cache"
            exit 1
          fi
          echo "PASS: cache-hit is not true as expected in lookup-only mode (value: '$CACHE_HIT', outcome: '$OUTCOME')"

      - name: Assert original file still exists (lookup-only does not delete files)
        run: |
          if [ ! -f /tmp/cache-lookup-test/data.txt ]; then
            echo "FAIL: file should still exist after lookup-only cache check"
            exit 1
          fi
          echo "PASS: file exists after lookup-only"
