name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate unique cache key
        id: gen-key
        run: echo "key=test-lookup-only-$(date +%s%N)-$$" >> "$GITHUB_OUTPUT"
      - name: Ensure cache target directory does not exist
        run: |
          rm -rf /tmp/cache-lookup-test
      - id: cache
        uses: .
        with:
          path: /tmp/cache-lookup-test
          key: ${{ steps.gen-key.outputs.key }}
          lookup-only: 'true'
        continue-on-error: true
      - name: Assert cache-hit is not true for unique key in lookup-only mode
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "outcome: $OUTCOME"
          # With a unique key, cache-hit must NOT be "true".
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false for a unique key"
            exit 1
          fi
          echo "PASS: cache-hit is not true as expected"
      - name: Assert path was not populated (lookup-only does not download)
        run: |
          if [ -d /tmp/cache-lookup-test ]; then
            echo "FAIL: directory should not exist since lookup-only does not download"
            exit 1
          fi
          echo "PASS: path not populated in lookup-only mode"
