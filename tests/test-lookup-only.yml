name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to reference
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache-lookup-test"
          echo "lookup data" > "$GITHUB_WORKSPACE/cache-lookup-test/file.txt"

      - id: cache
        uses: .
        with:
          path: ${{ github.workspace }}/cache-lookup-test
          key: test-lookup-only-${{ github.run_id }}-${{ github.run_attempt }}-unique
          lookup-only: 'true'
        continue-on-error: true

      - name: Assert action succeeded in lookup-only mode
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # Under act, the cache service is unavailable, so the action exits early
          # with success and cache-hit=false. In lookup-only mode with no prior cache,
          # cache-hit should not be true.
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step to succeed in lookup-only mode, got: $OUTCOME"
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false in lookup-only mode with unique key"
            exit 1
          fi
          echo "PASS: action succeeded in lookup-only mode and cache-hit is not true"
