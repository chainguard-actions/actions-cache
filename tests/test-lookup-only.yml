name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to reference
        run: |
          mkdir -p /tmp/test-lookup-dir
          echo "lookup-only test" > /tmp/test-lookup-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-lookup-dir
          key: test-cache-lookup-only-nonexistent-${{ github.run_id }}
          lookup-only: 'true'

      - name: Assert lookup-only behavior
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With lookup-only=true and a unique key, cache-hit should be false
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a unique key in lookup-only mode"
              exit 1
            fi
            echo "PASS: lookup-only mode ran successfully, cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache API not available for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert file was NOT downloaded (lookup-only should not restore)
        env:
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Only check if the action succeeded (cache API was available)
          if [ "$OUTCOME" = "success" ]; then
            # The original file exists because we created it above, but
            # lookup-only should not have restored anything from cache
            # We verify the action completed without downloading
            echo "PASS: lookup-only mode did not attempt to restore cache files"
          else
            echo "PASS: skipping file check since action did not succeed"
          fi
