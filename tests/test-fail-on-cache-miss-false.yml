name: Test fail-on-cache-miss false (default behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory to cache
        run: |
          mkdir -p /tmp/cache-no-fail
          echo "test data" > /tmp/cache-no-fail/file.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-no-fail
          key: test-no-fail-unique-key-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: 'false'
        continue-on-error: true
      - name: Assert step did not fail due to cache miss
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed even though fail-on-cache-miss is false"
            exit 1
          fi
          echo "PASS: action did not fail on cache miss"
