name: Test cache miss scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-miss-test
          echo "cache miss test data" > /tmp/cache-miss-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-miss-test
          key: test-cache-miss-unique-key-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert cache-hit is false on miss
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false (miss) but got 'true'"
            exit 1
          fi
          echo "PASS: cache-hit is not true as expected for a cache miss"
