name: Test restore-keys fallback (cache miss with prefix fallback)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to potentially cache
        run: |
          mkdir -p /tmp/cache-restore-keys-dir
          echo "restore keys test" > /tmp/cache-restore-keys-dir/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-restore-keys-dir
          key: test-cache-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-cache-restore-keys-prefix-
            test-cache-restore-keys-
        continue-on-error: true

      - name: Assert restore-keys result
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With a unique key and no prior cache, cache-hit should be false or empty
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a unique key with restore-keys fallback"
              exit 1
            fi
            echo "PASS: cache miss as expected with restore-keys (cache-hit='$CACHE_HIT')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in act)"
          else
            # In act, outcome may be empty or unexpected due to process.exit() behavior
            echo "INFO: outcome was '$OUTCOME' - treating as acceptable in act environment"
            echo "PASS"
          fi
