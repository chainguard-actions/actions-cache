name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Disable cache service so the action exits early without network calls.
      # @actions/cache v6 checks these env vars to determine if cache is available.
      ACTIONS_CACHE_URL: ""
      ACTIONS_RESULTS_URL: ""
      ACTIONS_CACHE_SERVICE_V2: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/test-restore-keys-dir
          echo "restore keys test" > /tmp/test-restore-keys-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-restore-keys-dir
          key: test-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-restore-keys-prefix-
            test-restore-keys-

      - name: Assert restore-keys scenario ran correctly
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With a unique exact key and no prior cache, cache-hit should be false.
            # (restore-keys may find a partial match but cache-hit is only true for exact match)
            if [ "$CACHE_HIT" = "true" ]; then
              echo "WARN: cache-hit is true — a prior cache entry matched the exact key (unlikely but possible)"
            fi
            echo "PASS: action ran successfully with restore-keys configured, cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in this environment)"
          else
            echo "PASS: outcome was '$OUTCOME'"
          fi
