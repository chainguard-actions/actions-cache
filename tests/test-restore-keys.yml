name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/restore-keys-test-dir
          echo "restore keys test" > /tmp/restore-keys-test-dir/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/restore-keys-test-dir
          key: test-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-restore-keys-prefix-
            test-restore-keys-

      - name: Assert restore-keys scenario ran correctly
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With a unique key and no prior cache, cache-hit should be false
            # (restore-keys may find a partial match but cache-hit is still false)
            echo "PASS: restore-keys scenario ran successfully, cache-hit=$CACHE_HIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
