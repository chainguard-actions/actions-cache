name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache-restore-keys-test"
          echo "restore keys data" > "$GITHUB_WORKSPACE/cache-restore-keys-test/file.txt"

      - id: cache
        uses: .
        with:
          path: ${{ github.workspace }}/cache-restore-keys-test
          key: test-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}-unique
          restore-keys: |
            test-restore-keys-prefix-
            test-restore-keys-
        continue-on-error: true

      - name: Assert action succeeded with restore-keys
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # Under act, the cache service is unavailable, so the action exits early
          # with success and cache-hit=false. With restore-keys and no prior cache,
          # cache-hit should not be true.
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step to succeed even with no cache match, got: $OUTCOME"
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false when no cache exists"
            exit 1
          fi
          echo "PASS: action succeeded and cache-hit is not true (no prior cache)"
