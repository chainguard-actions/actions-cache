name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/test-restore-keys-dir
          echo "restore-keys test" > /tmp/test-restore-keys-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-restore-keys-dir
          key: test-cache-restore-keys-exact-${{ github.run_id }}
          restore-keys: |
            test-cache-restore-keys-prefix-
            test-cache-restore-keys-

      - name: Assert restore-keys behavior
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            # With a unique key and no prior cache, cache-hit should be false
            # (either exact miss or prefix miss)
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: expected cache-hit=false for a unique key with no prior cache"
              exit 1
            fi
            echo "PASS: restore-keys accepted, cache-hit='$CACHE_HIT' (expected false)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache API not available for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
