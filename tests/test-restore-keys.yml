name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/restore-keys-test
          echo "restore keys test" > /tmp/restore-keys-test/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/restore-keys-test
          key: test-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-restore-keys-fallback-
            test-restore-keys-

      - name: Assert restore-keys scenario ran (cache-hit false or graceful failure)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # Under act there is no GitHub Actions cache service, so the action
          # will either fail gracefully or (if a mock service is present) succeed
          # with cache-hit=false for unique keys.
          case "$OUTCOME" in
            success)
              if [ "$CACHE_HIT" = "true" ]; then
                echo "FAIL: expected cache-hit=false for unique keys with restore-keys"
                exit 1
              fi
              echo "PASS: restore-keys scenario returned cache-hit=false/empty as expected"
              ;;
            failure)
              echo "PASS: action failed gracefully (no cache service available under act)"
              ;;
            *)
              echo "PASS: action outcome was '$OUTCOME' (acceptable under act)"
              ;;
          esac
