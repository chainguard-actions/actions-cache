name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory to cache
        run: |
          mkdir -p /tmp/cache-restore-keys
          echo "restore keys test" > /tmp/cache-restore-keys/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-restore-keys
          key: test-restore-keys-exact-${{ runner.os }}-abc123
          restore-keys: |
            test-restore-keys-${{ runner.os }}-
            test-restore-keys-
        continue-on-error: true
      - name: Assert restore-keys step completed
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be false since no exact key match exists
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: cache-hit should not be true when using restore-keys fallback with no prior cache"
            exit 1
          fi
          echo "PASS: cache-hit is not true (expected with restore-keys and no prior cache)"
