name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/restore-keys-test
          echo "restore-keys test data" > /tmp/restore-keys-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/restore-keys-test
          key: test-restore-keys-primary-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-restore-keys-fallback-${{ github.run_id }}-
            test-restore-keys-fallback-
        continue-on-error: true

      - name: Assert cache-hit is false or empty (no matching primary or restore key)
        env:
          ACTUAL: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "actual cache-hit: $ACTUAL"
          # cache-hit is true only on exact primary key match; false for restore-keys match or miss
          # The action either succeeds with cache-hit=false, or fails gracefully
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected cache-hit to be false since no exact key match exists"
            exit 1
          fi
          echo "PASS: cache-hit is not true (no exact primary key match)"

      - name: Assert action completed (with or without cache service)
        env:
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "PASS: action completed (outcome: $OUTCOME) using restore-keys"
