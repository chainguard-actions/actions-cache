name: Test basic cache usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test
          echo "hello cache" > /tmp/cache-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-test
          key: test-cache-basic-${{ runner.os }}-v1

      - name: Assert cache-hit output is defined
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit output is valid (value: '$CACHE_HIT')"
