name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare cache path
        run: mkdir -p /tmp/cache-chunk-test && echo "chunk-size-test" > /tmp/cache-chunk-test/data.txt
      - id: action
        uses: .
        with:
          path: /tmp/cache-chunk-test
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 10485760
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # On a cache miss, cache-hit should be empty or 'false'
          if [ "$CACHE_HIT" = "true" ]; then
            echo "PASS: cache hit (unexpected but valid)"
          else
            echo "PASS: cache miss as expected (upload-chunk-size input accepted)"
          fi
