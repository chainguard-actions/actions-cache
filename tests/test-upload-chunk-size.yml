name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-upload-chunk-test
          echo "cache-content-upload-chunk" > /tmp/cache-upload-chunk-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-upload-chunk-test
          key: test-upload-chunk-size-${{ runner.os }}-v1
          upload-chunk-size: 33554432

      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either 'true' or 'false' (or empty on miss)
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: upload-chunk-size accepted and cache step completed"
