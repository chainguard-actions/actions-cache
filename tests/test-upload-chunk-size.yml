name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test-chunk
          echo "chunk-size-test-content" > /tmp/cache-test-chunk/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-test-chunk
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 1048576
          fail-on-cache-miss: 'false'
        continue-on-error: true
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # On a cache miss, cache-hit should be 'false' or empty (not an error)
          if [ "$CACHE_HIT" = "true" ]; then
            echo "PASS: cache hit (unexpected but valid)"
          else
            echo "PASS: cache miss as expected (upload-chunk-size input accepted)"
          fi
