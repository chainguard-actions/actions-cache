name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-chunk-test
          echo "chunk-size-test-content" > /tmp/cache-chunk-test/data.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-chunk-test
          key: test-upload-chunk-size-${{ runner.os }}-${{ github.run_id }}
          upload-chunk-size: 1048576
        continue-on-error: true

      - name: Assert cache-hit output is present and false (cache miss expected)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: unexpected cache hit on a unique key"
              exit 1
            fi
            echo "PASS: cache miss as expected, upload-chunk-size input accepted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
