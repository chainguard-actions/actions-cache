name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-chunk-test
          echo "chunk-size-test-content" > /tmp/cache-chunk-test/data.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-chunk-test
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 1048576

      - name: Assert action ran with upload-chunk-size input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload-chunk-size input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
