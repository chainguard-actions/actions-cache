name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test-chunk
          echo "hello chunk size test" > /tmp/cache-test-chunk/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-test-chunk
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 1048576
        continue-on-error: true
      - name: Assert cache-hit is false (cache miss expected on fresh run)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache miss but got cache hit"
            exit 1
          fi
          echo "PASS: cache miss as expected (upload-chunk-size input accepted)"
