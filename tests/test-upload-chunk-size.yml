name: Test upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-chunk-test
          echo "chunk-size-test-content" > /tmp/cache-chunk-test/data.txt

      - id: action
        uses: .
        with:
          path: /tmp/cache-chunk-test
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 1048576

      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # On a fresh run, cache-hit should be false (no prior cache)
          if [ "$CACHE_HIT" = "true" ]; then
            echo "PASS: cache hit (unexpected but valid)"
          else
            echo "PASS: cache miss as expected (no prior cache for this key)"
          fi
