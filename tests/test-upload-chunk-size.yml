name: Test cache with upload-chunk-size input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-upload-chunk-test
          echo "cache-content-upload-chunk-size" > /tmp/cache-upload-chunk-test/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-upload-chunk-test
          key: test-upload-chunk-size-${{ github.run_id }}
          upload-chunk-size: 33554432
          fail-on-cache-miss: 'false'

      - name: Assert action ran with upload-chunk-size input
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload-chunk-size input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
