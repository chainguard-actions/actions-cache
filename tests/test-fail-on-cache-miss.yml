name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to reference
        run: |
          mkdir -p /tmp/fail-test-dir
          echo "fail test" > /tmp/fail-test-dir/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/fail-test-dir
          key: test-fail-on-miss-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: 'true'

      - name: Assert action failed due to cache miss with fail-on-cache-miss=true
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (cache miss with fail-on-cache-miss=true, or cache service unavailable)"
          elif [ "$OUTCOME" = "success" ]; then
            # If the cache service is unavailable and the action somehow succeeded,
            # cache-hit must be false (no actual cache was found)
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: unexpected cache hit for a unique key"
              exit 1
            fi
            echo "NOTE: action succeeded despite fail-on-cache-miss=true (cache service may have returned gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
