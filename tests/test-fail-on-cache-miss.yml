name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/cache-fail-test
          echo "data" > /tmp/cache-fail-test/file.txt

      - id: cache
        uses: .
        with:
          path: /tmp/cache-fail-test
          key: test-fail-on-miss-unique-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: 'true'
        continue-on-error: true

      - name: Assert action failed due to cache miss
        env:
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # When fail-on-cache-miss=true and no cache exists, the action must fail.
          # If the cache service is unavailable, the action exits early with success
          # (before checking fail-on-cache-miss). In that case, we accept success
          # as the action gracefully handled the unavailable service.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on cache miss with fail-on-cache-miss=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "INFO: action succeeded (cache service unavailable, graceful early exit)"
            echo "PASS: acceptable outcome when cache service is not available in test environment"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
