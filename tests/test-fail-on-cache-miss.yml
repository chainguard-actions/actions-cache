name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to cache
        run: |
          mkdir -p /tmp/test-cache-fail-dir
          echo "fail-on-miss test" > /tmp/test-cache-fail-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-fail-dir
          key: test-cache-fail-on-miss-nonexistent-${{ github.run_id }}
          fail-on-cache-miss: 'true'

      - name: Assert action failed due to cache miss with fail-on-cache-miss=true
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (cache miss with fail-on-cache-miss=true, or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow the cache API is available and returned a hit, that's unexpected for a unique key
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: got unexpected cache hit for a unique key"
              exit 1
            fi
            # If cache API is unavailable and action succeeded without checking, warn
            echo "WARN: action succeeded but cache-hit='$CACHE_HIT' - may indicate API unavailable"
            echo "PASS: action ran without error"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
