name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate unique cache key
        id: gen-key
        run: echo "key=test-fail-on-miss-$(date +%s%N)-$$" >> "$GITHUB_OUTPUT"
      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-fail-test
          echo "fail on miss test" > /tmp/cache-fail-test/data.txt
      - id: cache
        uses: .
        with:
          path: /tmp/cache-fail-test
          key: ${{ steps.gen-key.outputs.key }}
          fail-on-cache-miss: 'true'
        continue-on-error: true
      - name: Assert step did not produce a cache hit
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "outcome: $OUTCOME"
          # With a unique key, cache-hit must NOT be "true".
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: expected cache-hit to be false for a unique key"
            exit 1
          fi
          # When cache service is available: step fails (fail-on-cache-miss=true, cache miss).
          # When cache service is not available: action exits early with success.
          # Both outcomes are valid for this test.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step outcome is '$OUTCOME' and cache-hit is not true"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
