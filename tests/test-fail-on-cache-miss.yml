name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-fail-test
          echo "hello" > /tmp/cache-fail-test/data.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-fail-test
          key: test-fail-on-miss-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: 'true'

      - name: Assert action behaved correctly with fail-on-cache-miss
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          # When cache service is available: action should fail (no cache exists, fail-on-cache-miss=true)
          # When cache service is NOT available (act): action exits early with success and cache-hit=false
          # Both outcomes are acceptable under act.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on cache miss (cache service available)"
          elif [ "$OUTCOME" = "success" ] && [ "$CACHE_HIT" != "true" ]; then
            echo "PASS: action exited early (cache service not available under act), cache-hit is not true"
          else
            echo "FAIL: unexpected outcome='$OUTCOME' cache-hit='$CACHE_HIT'"
            exit 1
          fi
