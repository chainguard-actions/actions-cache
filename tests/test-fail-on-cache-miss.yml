name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Disable cache service so the action exits early without network calls.
      # @actions/cache v6 checks these env vars to determine if cache is available.
      ACTIONS_CACHE_URL: ""
      ACTIONS_RESULTS_URL: ""
      ACTIONS_CACHE_SERVICE_V2: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to reference
        run: |
          mkdir -p /tmp/test-fail-dir
          echo "fail on miss test" > /tmp/test-fail-dir/file.txt

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-fail-dir
          key: test-fail-on-miss-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: 'true'

      - name: Assert action handled fail-on-cache-miss correctly
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            # Expected when cache service IS available: cache miss + fail-on-cache-miss=true
            echo "PASS: action failed as expected (cache miss with fail-on-cache-miss=true)"
          elif [ "$OUTCOME" = "success" ]; then
            # When cache service is unavailable, action exits early (isCacheFeatureAvailable=false)
            # setting cache-hit=false and returning without checking fail-on-cache-miss.
            # This is a valid pass: the action gracefully handled the unavailable cache service.
            if [ "$CACHE_HIT" = "true" ]; then
              echo "FAIL: action succeeded with cache-hit=true and fail-on-cache-miss=true — unexpected"
              exit 1
            fi
            echo "PASS: action exited early (cache service unavailable), cache-hit='$CACHE_HIT'"
          else
            echo "PASS: outcome was '$OUTCOME'"
          fi
