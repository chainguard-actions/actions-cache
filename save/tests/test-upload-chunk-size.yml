name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-chunk-test
          echo "chunk-size-test-content" > /tmp/cache-chunk-test/data.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-chunk-test
          key: test-chunk-size-${{ github.run_id }}-${{ github.run_attempt }}
          upload-chunk-size: 10485760

      - name: Assert action ran with upload-chunk-size input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with upload-chunk-size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with upload-chunk-size input (failed gracefully, likely due to sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
