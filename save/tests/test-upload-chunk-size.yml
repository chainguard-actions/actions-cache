name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to cache
        run: |
          mkdir -p /tmp/chunk-cache-test
          dd if=/dev/urandom bs=1024 count=512 of=/tmp/chunk-cache-test/large-file.bin 2>/dev/null || \
            head -c 524288 /dev/urandom > /tmp/chunk-cache-test/large-file.bin
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/chunk-cache-test
          key: test-chunk-cache-key-${{ github.run_id }}
          upload-chunk-size: 1048576
      - name: Assert action ran with upload-chunk-size (cache save may fail without cache service)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with upload-chunk-size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
