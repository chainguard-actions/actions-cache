name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/chunk-test
          dd if=/dev/urandom bs=1024 count=512 of=/tmp/chunk-test/bigfile.bin 2>/dev/null || \
            head -c 524288 /dev/urandom > /tmp/chunk-test/bigfile.bin

      - id: cache-save
        uses: .
        continue-on-error: true
        with:
          path: /tmp/chunk-test
          key: test-cache-chunk-${{ github.sha }}
          upload-chunk-size: 32768

      - name: Assert action ran with upload-chunk-size (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.cache-save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with upload-chunk-size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (no cache service available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
