name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/chunk-cache-test
          dd if=/dev/urandom bs=1024 count=512 of=/tmp/chunk-cache-test/large-file.bin 2>/dev/null
          echo "chunk size test" > /tmp/chunk-cache-test/meta.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/chunk-cache-test
          key: test-chunk-cache-${{ github.run_id }}
          upload-chunk-size: 524288

      - name: Assert action ran with upload-chunk-size input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with upload-chunk-size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (expected under harness — cache service not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
