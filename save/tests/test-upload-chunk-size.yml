name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/cache-chunked
          dd if=/dev/urandom bs=1024 count=512 of=/tmp/cache-chunked/large-file.bin 2>/dev/null || true
          echo "chunk test" > /tmp/cache-chunked/meta.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-chunked
          key: test-chunk-cache-${{ github.sha }}
          upload-chunk-size: 524288

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with chunk size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
