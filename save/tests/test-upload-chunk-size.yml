name: Test cache save with upload-chunk-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/cache-chunk-test
          dd if=/dev/urandom bs=1024 count=512 of=/tmp/cache-chunk-test/bigfile.bin 2>/dev/null || \
            head -c 524288 /dev/urandom > /tmp/cache-chunk-test/bigfile.bin

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-chunk-test
          key: test-chunk-cache-${{ github.run_id }}
          upload-chunk-size: 1048576

      - name: Assert action ran with upload-chunk-size (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with upload-chunk-size succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
