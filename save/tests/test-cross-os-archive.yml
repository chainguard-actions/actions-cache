name: Test cache save with cross-OS archive enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cross-os-cache-test
          echo "cross-os cache content" > /tmp/cross-os-cache-test/data.txt

      - id: save
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cross-os-cache-test
          key: test-cross-os-cache-${{ github.sha }}
          enableCrossOsArchive: 'true'

      - name: Assert action ran with cross-OS archive enabled
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with enableCrossOsArchive=true succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
