name: Test cache save with enableCrossOsArchive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/cache-cross-os-test
          echo "cross-os cache content" > /tmp/cache-cross-os-test/data.txt

      - id: cache-save
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-cross-os-test
          key: test-cache-cross-os-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Assert action ran with enableCrossOsArchive input
        env:
          OUTCOME: ${{ steps.cache-save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with enableCrossOsArchive succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
