name: Test cache save with cross-OS archive enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/cache-crossos-test
          echo "cross-os cache content" > /tmp/cache-crossos-test/data.txt
          echo "another file" > /tmp/cache-crossos-test/extra.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-crossos-test
          key: test-crossos-cache-${{ github.run_id }}
          enableCrossOsArchive: 'true'

      - name: Assert action ran with cross-OS archive enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with enableCrossOsArchive=true succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
