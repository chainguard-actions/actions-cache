name: Test cache save with cross-OS archive enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files to cache
        run: |
          mkdir -p /tmp/cross-os-cache
          echo "cross-os-data" > /tmp/cross-os-cache/artifact.txt
          echo "Created cross-OS cache file:"
          cat /tmp/cross-os-cache/artifact.txt

      - id: save
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cross-os-cache
          key: test-cache-cross-os-${{ github.run_id }}
          enableCrossOsArchive: 'true'

      - name: Assert action ran with cross-OS flag (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with enableCrossOsArchive succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (expected under sentinel repo / no cache service)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
