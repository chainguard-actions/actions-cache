name: Test basic cache save
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to cache
        run: |
          mkdir -p /tmp/cache-test
          echo "hello cache" > /tmp/cache-test/data.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/cache-test
          key: test-basic-cache-${{ github.run_id }}

      - name: Assert action ran (cache save may fail on sentinel repo but should not crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (expected under harness — cache service not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
