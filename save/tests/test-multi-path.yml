name: Test cache save with multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple directories to cache
        run: |
          mkdir -p /tmp/cache-path-a
          echo "path a content" > /tmp/cache-path-a/file-a.txt
          mkdir -p /tmp/cache-path-b
          echo "path b content" > /tmp/cache-path-b/file-b.txt

      - id: cache-save
        uses: .
        continue-on-error: true
        with:
          path: |
            /tmp/cache-path-a
            /tmp/cache-path-b
          key: test-cache-multi-path-${{ github.sha }}

      - name: Assert action ran with multiple paths
        env:
          OUTCOME: ${{ steps.cache-save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with multiple paths succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
