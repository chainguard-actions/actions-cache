name: Test cache save with multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple directories to cache
        run: |
          mkdir -p /tmp/cache-dir-a
          echo "dir-a content" > /tmp/cache-dir-a/file-a.txt
          mkdir -p /tmp/cache-dir-b
          echo "dir-b content" > /tmp/cache-dir-b/file-b.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: |
            /tmp/cache-dir-a
            /tmp/cache-dir-b
          key: test-multi-path-cache-${{ github.run_id }}
          enableCrossOsArchive: 'false'

      - name: Assert action ran with multiple paths
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with multiple paths succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (expected under harness — cache service not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
