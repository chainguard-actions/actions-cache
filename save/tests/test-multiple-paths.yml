name: Test cache save with multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple directories to cache
        run: |
          mkdir -p /tmp/cache-multi-a
          mkdir -p /tmp/cache-multi-b
          echo "path A content" > /tmp/cache-multi-a/file-a.txt
          echo "path B content" > /tmp/cache-multi-b/file-b.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: |
            /tmp/cache-multi-a
            /tmp/cache-multi-b
          key: test-multi-path-cache-${{ github.run_id }}

      - name: Assert action ran with multiple paths
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with multiple paths succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
