name: Test cache save with multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple directories to cache
        run: |
          mkdir -p /tmp/cache-dir-a
          mkdir -p /tmp/cache-dir-b
          echo "data-a" > /tmp/cache-dir-a/file-a.txt
          echo "data-b" > /tmp/cache-dir-b/file-b.txt
          echo "Created cache directories:"
          ls /tmp/cache-dir-a/
          ls /tmp/cache-dir-b/

      - id: save
        uses: .
        continue-on-error: true
        with:
          path: |
            /tmp/cache-dir-a
            /tmp/cache-dir-b
          key: test-cache-multi-paths-${{ github.run_id }}

      - name: Assert action ran with multiple paths (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache save with multiple paths succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cache save failed gracefully (expected under sentinel repo / no cache service)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
