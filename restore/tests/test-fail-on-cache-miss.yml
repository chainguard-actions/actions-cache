name: Test cache restore fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory for cache path
        run: mkdir -p /tmp/test-fail-cache-dir

      - id: restore
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-fail-cache-dir
          key: test-fail-on-miss-unique-key-${{ runner.os }}-${{ github.run_id }}-v1
          fail-on-cache-miss: 'true'

      - name: Assert action ran correctly with fail-on-cache-miss=true
        env:
          OUTCOME: ${{ steps.restore.outcome }}
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ "$OUTCOME" = "failure" ]; then
            # Expected: either no cache service (early exit with error) or cache miss with fail-on-cache-miss=true
            echo "PASS: action failed as expected (cache miss with fail-on-cache-miss=true, or no cache service)"
          elif [ "$OUTCOME" = "success" ]; then
            # When ACTIONS_CACHE_URL is not set, the action may exit early before checking fail-on-cache-miss.
            # This is acceptable under act where no cache service is available.
            echo "PASS: action succeeded (no cache service available, exited early before fail-on-cache-miss check)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
