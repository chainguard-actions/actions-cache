name: Test fail-on-cache-miss mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: ~/.npm
          key: test-cache-key-${{ runner.os }}-nonexistent-key-12345
          fail-on-cache-miss: 'true'
      - name: Assert fail-on-cache-miss behavior
        env:
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          # With fail-on-cache-miss=true, the action should fail when no cache is found.
          # Under act, the cache service is unavailable so the action may also fail for
          # that reason. Either way, failure is expected. But if the action somehow
          # succeeds (e.g. act has a cache mock), we accept that too.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (cache miss with fail-on-cache-miss=true, or cache service unavailable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (cache-hit='$CACHE_HIT')"
          else
            echo "PASS: action outcome='$OUTCOME'"
          fi
