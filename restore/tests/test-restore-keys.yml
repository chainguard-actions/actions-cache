name: Test restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-dir
          key: test-primary-key-${{ github.sha }}-unique
          restore-keys: |
            test-primary-key-
            test-

      - name: Assert restore-keys behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.action.outputs.cache-matched-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-matched-key: $MATCHED_KEY"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: restore-keys scenario completed, cache-hit='$CACHE_HIT', matched-key='$MATCHED_KEY'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
