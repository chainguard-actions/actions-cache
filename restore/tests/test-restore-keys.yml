name: Test cache restore with restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory for cache path
        run: mkdir -p /tmp/test-restore-keys-dir

      - id: restore
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-restore-keys-dir
          key: test-restore-keys-exact-${{ runner.os }}-v1-abc123
          restore-keys: |
            test-restore-keys-exact-${{ runner.os }}-v1-
            test-restore-keys-exact-${{ runner.os }}-
            test-restore-keys-exact-

      - name: Assert restore-keys are accepted and action runs correctly
        env:
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          OUTCOME: ${{ steps.restore.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-matched-key: $MATCHED_KEY"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no cache service available under act)"
          elif [ "$OUTCOME" = "success" ]; then
            # When ACTIONS_CACHE_URL is not set, the action exits early without setting outputs.
            # Accept both: outputs set (cache service available) or empty (no service).
            if [ -n "$PRIMARY_KEY" ]; then
              # Cache service available: on a miss, cache-hit=false, cache-matched-key may be empty
              echo "PASS: restore with restore-keys completed, primary-key='$PRIMARY_KEY', matched-key='$MATCHED_KEY', cache-hit='$CACHE_HIT'"
            else
              echo "PASS: action succeeded without cache service (no outputs set, expected under act)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
