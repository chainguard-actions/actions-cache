name: Test cache restore with restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/test-cache-restore-keys
          key: test-restore-keys-exact-${{ runner.os }}-v1
          restore-keys: |
            test-restore-keys-${{ runner.os }}-
            test-restore-keys-
        continue-on-error: true
      - name: Assert action ran with restore-keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.action.outputs.cache-matched-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-matched-key: $MATCHED_KEY"
          if [ "$OUTCOME" = "success" ]; then
            # cache-primary-key should be set to the exact key we provided
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with restore-keys, cache-primary-key=$PRIMARY_KEY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
