name: Test cache restore with restore-keys fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: restore
        uses: .
        with:
          path: /tmp/test-cache-restore-keys
          key: test-restore-keys-exact-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-restore-keys-prefix-
            test-restore-keys-
      - name: Assert cache-primary-key output is set
        env:
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        run: |
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ -z "$PRIMARY_KEY" ]; then
            echo "FAIL: cache-primary-key output is empty"
            exit 1
          fi
          echo "PASS: cache-primary-key is set to '$PRIMARY_KEY'"
      - name: Assert cache-hit is false (no pre-existing cache)
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # With a unique key and no pre-existing cache, cache-hit should be false
          if [ "$CACHE_HIT" = "true" ]; then
            echo "WARN: unexpected cache hit"
          else
            echo "PASS: cache-hit is not true (expected miss with restore-keys fallback)"
          fi
