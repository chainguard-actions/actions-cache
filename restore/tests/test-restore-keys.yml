name: Test cache restore with restore-keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/cache-test-restore-keys
          key: test-restore-keys-exact-${{ github.sha }}
          restore-keys: |
            test-restore-keys-prefix-
            test-restore-keys-
        continue-on-error: true
      - name: Assert outputs with restore-keys
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.action.outputs.cache-matched-key }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-matched-key: $MATCHED_KEY"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in harness)"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: restore-keys scenario completed, primary-key=$PRIMARY_KEY"
            exit 0
          fi
          echo "FAIL: unexpected outcome '$OUTCOME'"
          exit 1
