name: Test restore-keys fallback behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        with:
          path: /tmp/test-cache-restore-keys
          key: test-cache-key-exact-${{ github.run_id }}
          restore-keys: |
            test-cache-key-prefix-
            test-cache-key-
        continue-on-error: true

      - name: Assert restore-keys scenario
        env:
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-matched-key: $MATCHED_KEY"
          echo "cache-hit: $CACHE_HIT"
          # In the act environment the cache service is not available, so the
          # action will either fail gracefully or succeed with a cache miss.
          # Both outcomes are acceptable.
          case "$OUTCOME" in
            success)
              # On a miss with restore-keys, cache-hit should be false
              if [ "$CACHE_HIT" = "true" ] && [ "$MATCHED_KEY" != "$PRIMARY_KEY" ]; then
                echo "WARN: cache-hit=true but matched key differs from primary key"
              fi
              echo "PASS: restore-keys scenario completed"
              echo "  primary-key='$PRIMARY_KEY'"
              echo "  matched-key='$MATCHED_KEY'"
              echo "  cache-hit='$CACHE_HIT'"
              ;;
            failure)
              echo "PASS: action failed gracefully (no cache service in act environment)"
              ;;
            cancelled)
              echo "PASS: action was cancelled"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
