name: Test basic cache restore (cache miss)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: ~/.npm
          key: test-cache-key-${{ runner.os }}-basic
      - name: Assert cache action ran (success or graceful failure)
        env:
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          # Accept any outcome: the cache service is not available under act,
          # so the action may succeed (with or without outputs) or fail gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded, cache-primary-key='$PRIMARY_KEY', cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "PASS: action outcome='$OUTCOME'"
          fi
