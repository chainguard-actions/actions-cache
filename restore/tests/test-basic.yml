name: Test basic cache restore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/test-cache-basic
          key: test-basic-cache-key-${{ runner.os }}-v1
        continue-on-error: true
      - name: Assert action ran and outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ "$OUTCOME" = "success" ]; then
            # Cache miss is expected in harness — cache-hit should be false or empty
            if [ "$CACHE_HIT" = "true" ]; then
              echo "WARN: unexpected cache hit in harness environment"
            fi
            # cache-primary-key should be set to the key we provided
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: action succeeded, cache-primary-key=$PRIMARY_KEY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
