name: Test basic cache restore (cache miss, no fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        with:
          path: /tmp/test-cache-dir
          key: test-cache-key-basic-${{ github.run_id }}
        continue-on-error: true

      - name: Assert cache step ran and outputs are acceptable
        env:
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          # In the act environment the cache service is not available, so the
          # action will either fail gracefully or succeed with a cache miss.
          # Both outcomes are acceptable. The only unacceptable outcome is an
          # unexpected value (not success, failure, or cancelled).
          case "$OUTCOME" in
            success)
              # If it succeeded, cache-hit should not be 'true' for a unique key
              if [ "$CACHE_HIT" = "true" ]; then
                echo "WARN: unexpected cache hit for unique key (possible stale cache)"
              fi
              echo "PASS: action succeeded (cache miss or hit)"
              ;;
            failure)
              echo "PASS: action failed gracefully (no cache service in act environment)"
              ;;
            cancelled)
              echo "PASS: action was cancelled"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
