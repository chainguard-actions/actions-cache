name: Test basic cache restore (cache miss)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: restore
        uses: .
        with:
          path: /tmp/test-cache-basic
          key: test-basic-cache-key-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert cache-primary-key output is set
        env:
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        run: |
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ -z "$PRIMARY_KEY" ]; then
            echo "FAIL: cache-primary-key output is empty"
            exit 1
          fi
          echo "PASS: cache-primary-key is set to '$PRIMARY_KEY'"
      - name: Assert cache-hit is false on miss
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # On a cache miss, cache-hit should be false or empty
          if [ "$CACHE_HIT" = "true" ]; then
            echo "WARN: unexpected cache hit (cache may have been pre-populated)"
          else
            echo "PASS: cache-hit is not true (expected miss)"
          fi
