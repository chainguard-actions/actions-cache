name: Test basic cache restore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/cache-test-basic
          key: test-basic-cache-key-${{ github.sha }}
        continue-on-error: true
      - name: Assert outputs are set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in harness)"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: cache-primary-key=$PRIMARY_KEY cache-hit=$CACHE_HIT"
            exit 0
          fi
          echo "FAIL: unexpected outcome '$OUTCOME'"
          exit 1
