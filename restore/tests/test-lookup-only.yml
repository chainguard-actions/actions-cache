name: Test cache restore with lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-lookup-cache
          key: test-lookup-only-${{ runner.os }}-unique-key-abc
          lookup-only: 'true'

      - name: Assert lookup-only step outcome
        env:
          OUTCOME: ${{ steps.cache.outcome }}
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: lookup-only completed, cache-hit='$CACHE_HIT', primary-key='$PRIMARY_KEY'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          elif [ -z "$OUTCOME" ]; then
            echo "PASS: action outcome is empty (runner-level failure, cache service unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success, failure, or empty)"
            exit 1
          fi
