name: Test cache restore with lookup-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: restore
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-lookup-only
          key: test-lookup-only-${{ github.sha }}
          lookup-only: 'true'
      - name: Assert lookup-only behavior
        env:
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          OUTCOME: ${{ steps.restore.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: action succeeded but cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: lookup-only completed, cache-primary-key is '$PRIMARY_KEY'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
