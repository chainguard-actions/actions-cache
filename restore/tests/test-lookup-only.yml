name: Test cache restore lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/cache-test-lookup
          key: test-lookup-only-cache-key-${{ github.sha }}
          lookup-only: 'true'
        continue-on-error: true
      - name: Assert lookup-only behavior
        env:
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or no cache)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: action succeeded but cache-primary-key is empty"
              exit 1
            fi
            echo "PASS: lookup-only succeeded, cache-primary-key='$PRIMARY_KEY', cache-hit='$CACHE_HIT'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
