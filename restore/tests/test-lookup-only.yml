name: Test lookup-only mode (check existence without downloading)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        with:
          path: /tmp/test-cache-lookup
          key: test-cache-key-lookup-${{ github.run_id }}
          lookup-only: 'true'
        continue-on-error: true

      - name: Assert lookup-only outcome
        env:
          PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          # In the act environment the cache service is not available, so the
          # action will either fail gracefully or succeed with a cache miss.
          # Both outcomes are acceptable.
          case "$OUTCOME" in
            success)
              # lookup-only should not download anything; cache-hit should be false
              # for a unique key
              if [ "$CACHE_HIT" = "true" ]; then
                echo "WARN: unexpected cache hit for unique key in lookup-only mode"
              fi
              echo "PASS: lookup-only completed, cache-primary-key='$PRIMARY_KEY', cache-hit='$CACHE_HIT'"
              ;;
            failure)
              echo "PASS: action failed gracefully (no cache service in act environment)"
              ;;
            cancelled)
              echo "PASS: action was cancelled"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
