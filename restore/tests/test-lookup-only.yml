name: Test cache restore lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: /tmp/test-cache-lookup-only
          key: test-lookup-only-${{ runner.os }}-v1
          lookup-only: 'true'
        continue-on-error: true
      - name: Assert lookup-only action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PRIMARY_KEY: ${{ steps.action.outputs.cache-primary-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $PRIMARY_KEY"
          if [ "$OUTCOME" = "success" ]; then
            # In lookup-only mode, no files are downloaded even on a hit
            # cache-hit should be false (no cache in harness) or true if somehow cached
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: lookup-only action succeeded, cache-primary-key=$PRIMARY_KEY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
