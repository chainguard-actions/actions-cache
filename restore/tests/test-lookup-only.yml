name: Test cache restore lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: restore
        uses: .
        continue-on-error: true
        with:
          key: test-cache-key-${{ runner.os }}-lookup-only
          path: /tmp/test-cache-lookup
          lookup-only: 'true'
      - name: Assert action ran in lookup-only mode or failed gracefully
        env:
          OUTCOME: ${{ steps.restore.outcome }}
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRIMARY_KEY" ]; then
              echo "FAIL: action succeeded but cache-primary-key output is empty"
              exit 1
            fi
            echo "PASS: lookup-only mode completed, cache-hit=$CACHE_HIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no cache service in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
