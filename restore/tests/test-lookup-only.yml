name: Test lookup-only mode (no download)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: restore
        uses: .
        continue-on-error: true
        with:
          path: /tmp/test-cache-lookup
          key: test-lookup-only-cache-key-unique-67890
          lookup-only: 'true'
          fail-on-cache-miss: 'false'
      - name: Assert lookup-only behavior
        env:
          OUTCOME: ${{ steps.restore.outcome }}
          PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-primary-key: $PRIMARY_KEY"
          echo "cache-hit: $CACHE_HIT"

          # The action either succeeds (cache service available) or fails
          # (cache service unavailable under act). Both are acceptable.
          # The only unacceptable outcome is 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi

          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, validate the primary key output
            if [ -n "$PRIMARY_KEY" ] && [ "$PRIMARY_KEY" != "test-lookup-only-cache-key-unique-67890" ]; then
              echo "FAIL: expected cache-primary-key='test-lookup-only-cache-key-unique-67890' but got '$PRIMARY_KEY'"
              exit 1
            fi
            # In lookup-only mode, no files should be downloaded
            if [ -d /tmp/test-cache-lookup ]; then
              echo "WARN: directory exists but lookup-only should not download"
            fi
            echo "PASS: lookup-only mode completed, cache-primary-key='$PRIMARY_KEY'"
          else
            echo "PASS: action outcome was '$OUTCOME' (cache service unavailable in act)"
          fi
