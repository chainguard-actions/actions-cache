name: Add Reviewer PR
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
    - name: Get current oncall
      id: oncall
      env:
        PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
      run: |
        raw=$(curl --request GET 'https://api.pagerduty.com/oncalls?include[]=users&schedule_ids[]=P5VG2BX&earliest=true' --header "Authorization: Token token=$PAGERDUTY_TOKEN" --header 'Accept: application/vnd.pagerduty+json;version=2' --header 'Content-Type: application/json' | jq -r '.oncalls[].user.name')
        safe=$(printf '%s' "$raw" | tr -d '\n\r')
        echo "CURRENT=$safe" >> "$GITHUB_OUTPUT"

    - name: Request Review
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ONCALL_USER: ${{ steps.oncall.outputs.CURRENT }}
      run: |
        safe_user=$(printf '%s' "$ONCALL_USER" | tr -d '\n\r')
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
          -d "{\"reviewers\":[\"$safe_user\"]}"

    - name: Add Assignee
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ONCALL_USER: ${{ steps.oncall.outputs.CURRENT }}
      run: |
        safe_user=$(printf '%s' "$ONCALL_USER" | tr -d '\n\r')
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/assignees" \
          -d "{\"assignees\":[\"$safe_user\"]}"
