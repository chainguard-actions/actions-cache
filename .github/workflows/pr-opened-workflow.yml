name: Assign pull request reviewer

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Get current oncall
        id: oncall
        env:
          PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
        run: |
          echo "CURRENT=$(curl --request GET 'https://api.pagerduty.com/oncalls?include[]=users&schedule_ids[]=P5VG2BX&earliest=true' --header "Authorization: Token token=$PAGERDUTY_TOKEN" --header 'Accept: application/vnd.pagerduty+json;version=2' --header 'Content-Type: application/json' | jq -r '.oncalls[].user.name')" >> $GITHUB_OUTPUT

      - name: Request Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ steps.oncall.outputs.CURRENT }}
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" -d "{\"reviewers\":[\"$REVIEWER\"]}"

      - name: Add Assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ steps.oncall.outputs.CURRENT }}
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/issues/$PR_NUMBER/assignees" -d "{\"assignees\":[\"$ASSIGNEE\"]}"
